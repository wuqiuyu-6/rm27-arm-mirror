# 六轴映射：sim_q = sign * raw_q + zero（单位 rad）
#
# 本文件是**唯一来源**：CLI（arm_mirror）和网页端（web_mirror.py）都从这里读，
# 命令行 --sign / --zero / --flip 只做临时覆盖。
#
# 依据：
#   * 固件发来的 q 是 URDF/DH 模型坐标（User/gravity/gravity_capture.c）
#   * 实机与 model/arm_v7 的关节轴方向整体相反，所以 sign 全为 -1
#   * 六个关节的零位偏置都是 0（早期 joint3 曾用 ±90°、joint4 曾用 +1，实测后已修正）
#
# 复标方法见 docs/calibration.md。
sign:
  joint1: -1.0
  joint2: -1.0
  joint3: -1.0
  joint4: -1.0
  joint5: -1.0
  joint6: -1.0

zero:
  joint1: 0.0
  joint2: 0.0
  joint3: 0.0
  joint4: 0.0
  joint5: 0.0
  joint6: 0.0

serial:
  # Windows: COM8    Ubuntu: /dev/ttyUSB0 或 /dev/serial/by-id/...
  # 留空 = 自动探测（Windows 取第一个 COM 口，Linux 优先 /dev/serial/by-id）
  port: COM8
  baud: 115200

