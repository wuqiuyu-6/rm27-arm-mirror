[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "arm-mirror"
version = "0.1.0"
description = "RM27 six-axis arm pose mirror: serial frames to MuJoCo"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mujoco>=3.1",
    "pyserial>=3.5",
    "numpy>=1.24",
    "imageio>=2.31",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "ruff>=0.3"]

[project.scripts]
arm-mirror = "arm_mirror.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
