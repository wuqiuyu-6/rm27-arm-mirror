[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rm27-assembly"
version = "1.7.0"
description = "RMUC2027 tech-core assembly simulation: 1 kHz replay + web HMI"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["mujoco>=3.1", "numpy>=1.24", "Pillow>=10.0"]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[project.scripts]
rm27-assembly = "rm27_assembly.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
