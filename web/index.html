<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RM27 v1.9 · 键盘手动装配</title>
<style>
  :root { --bg:#0b0e14; --panel:#141922; --line:#232b38; --text:#d6dee8; --dim:#7b8798;
          --ok:#4ade80; --warn:#f59e0b; --bad:#ef4444; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text);
    font:14px/1.5 system-ui,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:10px 18px;
    border-bottom:1px solid var(--line); background:var(--panel); }
  header h1 { font-size:16px; margin:0; font-weight:600; }
  #status { margin-left:auto; display:flex; gap:14px; color:var(--dim); font-size:13px; }
  #status b { color:var(--text); }
  main { display:grid; grid-template-columns:1fr 330px; height:calc(100% - 49px); }
  #view { position:relative; }
  canvas { display:block; }
  #focusHint { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    background:rgba(11,14,20,.55); color:var(--text); font-size:15px; cursor:pointer; }
  #focusHint.hidden { display:none; }
  aside { border-left:1px solid var(--line); background:var(--panel); overflow-y:auto; }
  section { padding:12px 16px; border-bottom:1px solid var(--line); }
  h2 { font-size:12px; color:var(--dim); margin:0 0 8px; font-weight:600;
       text-transform:uppercase; letter-spacing:.08em; }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  td { padding:3px 0; } td:last-child { text-align:right; font-weight:600; }
  .muted { color:var(--dim); }
  .btns { display:flex; gap:8px; }
  button { flex:1; padding:8px 10px; border-radius:8px; border:1px solid var(--line);
    background:#1c2330; color:var(--text); font-size:13px; cursor:pointer; }
  button:hover { background:#232c3b; } button.on { border-color:var(--ok); color:var(--ok); }
  .lamp { display:inline-block; width:8px; height:8px; border-radius:50%; background:#3a4353; margin-right:6px; }
  .lamp.on { background:var(--ok); box-shadow:0 0 6px var(--ok); }
  kbd { background:#1c2330; border:1px solid var(--line); border-radius:4px; padding:0 5px; font-size:12px; }
  .keys td { font-size:12.5px; } .keys td:last-child { text-align:right; color:var(--dim); font-weight:400; }
  #done { font-weight:700; color:var(--ok); }
</style>
</head>
<body>
<header>
  <h1>RM27 v1.9 · 键盘手动装配</h1>
  <div id="status">
    <span>键盘 <b id="kb">未聚焦</b></span>
    <span>串口 <b id="serial">—</b></span>
    <span>深度 <b id="depth">—</b></span>
  </div>
</header>

<main>
  <div id="view">
    <div id="focusHint">点击这里启用键盘控制</div>
  </div>
  <aside>
    <section>
      <h2>判定</h2>
      <table><tbody>
        <tr><td><span class="lamp" id="lGrasp"></span>夹持</td><td id="vGrasp">—</td></tr>
        <tr><td><span class="lamp" id="lIns"></span>插入</td><td id="vIns">—</td></tr>
        <tr><td><span class="lamp" id="lP"></span>P 90°</td><td id="vP">—</td></tr>
        <tr><td><span class="lamp" id="lQ"></span>Q 51.6°</td><td id="vQ">—</td></tr>
      </tbody></table>
      <div style="margin-top:8px">状态：<b id="done">进行中</b></div>
    </section>

    <section>
      <h2>读数</h2>
      <table><tbody>
        <tr><td class="muted">插入深度</td><td id="rDepth">—</td></tr>
        <tr><td class="muted">轴对齐误差</td><td id="rAxis">—</td></tr>
        <tr><td class="muted">夹爪开度</td><td id="rGrip">—</td></tr>
        <tr><td class="muted">P 角</td><td id="rP">—</td></tr>
        <tr><td class="muted">Q 角</td><td id="rQ">—</td></tr>
      </tbody></table>
    </section>

    <section>
      <h2>底座</h2>
      <table><tbody>
        <tr><td class="muted">x</td><td id="cX">—</td><td class="muted">W/S</td></tr>
        <tr><td class="muted">y</td><td id="cY">—</td><td class="muted">A/D</td></tr>
        <tr><td class="muted">yaw</td><td id="cYaw">—</td><td class="muted">Q/E</td></tr>
      </tbody></table>
    </section>

    <section>
      <h2>关节 <span class="muted" style="font-weight:400">（1~6 选轴，↑/↓ 点动）</span></h2>
      <table><tbody id="joints"></tbody></table>
    </section>

    <section>
      <h2>夹爪 / 磁吸</h2>
      <div class="btns">
        <button id="btnOpen">打开 <kbd>H</kbd></button>
        <button id="btnClose">关闭 <kbd>G</kbd></button>
      </div>
      <div class="btns" style="margin-top:8px">
        <button id="btnMagnet">磁吸 <kbd>M</kbd></button>
        <button id="btnReset">复位 <kbd>R</kbd></button>
      </div>
    </section>

    <section>
      <h2>键位</h2>
      <table class="keys"><tbody>
        <tr><td>底座 前后/左右</td><td><kbd>W</kbd><kbd>S</kbd> <kbd>A</kbd><kbd>D</kbd></td></tr>
        <tr><td>底座 旋转</td><td><kbd>Q</kbd><kbd>E</kbd></td></tr>
        <tr><td>选关节 / 点动</td><td><kbd>1</kbd>~<kbd>6</kbd> <kbd>↑</kbd><kbd>↓</kbd></td></tr>
        <tr><td>夹爪 合/开</td><td><kbd>G</kbd><kbd>H</kbd></td></tr>
        <tr><td>P 轴 / Q 轴</td><td><kbd>Z</kbd><kbd>X</kbd> <kbd>C</kbd><kbd>V</kbd></td></tr>
        <tr><td>磁吸 / 复位</td><td><kbd>M</kbd> <kbd>R</kbd></td></tr>
        <tr><td>精调（按住）</td><td><kbd>Shift</kbd></td></tr>
      </tbody></table>
    </section>
  </aside>
</main>

<script type="module">
import * as THREE from './vendor/three.module.js';

const view = document.getElementById('view');
const focusHint = document.getElementById('focusHint');

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setClearColor(0x0b0e14, 1);
view.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.add(new THREE.HemisphereLight(0xbdd7ff, 0x1b2330, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.3); key.position.set(2, -2, 3); scene.add(key);
const fill = new THREE.DirectionalLight(0x88aaff, 0.55); fill.position.set(-2, 1, 1); scene.add(fill);
const grid = new THREE.GridHelper(4, 40, 0x2a3546, 0x1a2230);
grid.rotation.x = Math.PI / 2;   // MuJoCo 是 Z-up
scene.add(grid);

const camera = new THREE.PerspectiveCamera(45, 1, 0.01, 100);
camera.up.set(0, 0, 1);          // 关键：Z-up 才能和 MuJoCo 一致
const orbit = { yaw: 2.3, pitch: -0.25, dist: 1.5, target: new THREE.Vector3(0.25, 0, 0.25) };
function applyCamera() {
  const c = Math.cos(orbit.pitch), s = Math.sin(orbit.pitch);
  camera.position.set(orbit.target.x + orbit.dist * c * Math.sin(orbit.yaw),
                      orbit.target.y - orbit.dist * c * Math.cos(orbit.yaw),
                      orbit.target.z - orbit.dist * s);   // 负号：pitch<0 时相机在上方
  camera.lookAt(orbit.target);
}
applyCamera();

let drag = null;
renderer.domElement.addEventListener('pointerdown', e => { drag = {x:e.clientX,y:e.clientY,b:e.button}; focusCanvas(); });
addEventListener('pointerup', () => drag = null);
addEventListener('pointermove', e => {
  if (!drag) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  drag.x = e.clientX; drag.y = e.clientY;
  if (drag.b === 0) { orbit.yaw += dx * 0.01; orbit.pitch = Math.max(-1.4, Math.min(1.4, orbit.pitch + dy * 0.01)); }
  else { orbit.target.x -= dx * 0.002; orbit.target.z += dy * 0.002; }
  applyCamera();
});
renderer.domElement.addEventListener('contextmenu', e => e.preventDefault());
renderer.domElement.addEventListener('wheel', e => {
  orbit.dist = Math.max(0.3, Math.min(5, orbit.dist * (1 + Math.sign(e.deltaY) * 0.1)));
  applyCamera(); e.preventDefault();
}, { passive: false });

let bodyNodes = [], meta = null, pivot = new THREE.Group();
scene.add(pivot);

function buildMesh(g) {
  if (g.type === 'mesh') {
    const verts = new Float32Array(Uint8Array.from(atob(g.v), c => c.charCodeAt(0)).buffer);
    const faces = new Uint32Array(Uint8Array.from(atob(g.f), c => c.charCodeAt(0)).buffer);
    const geo = new THREE.BufferGeometry();
    geo.setAttribute('position', new THREE.BufferAttribute(verts, 3));
    geo.setIndex(new THREE.BufferAttribute(faces, 1));
    geo.computeVertexNormals();
    return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
      color: new THREE.Color(...g.rgba.slice(0,3)), metalness:0.25, roughness:0.55, side:THREE.DoubleSide }));
  }
  if (g.type === 'box') return new THREE.Mesh(
    new THREE.BoxGeometry(g.size[0]*2, g.size[1]*2, g.size[2]*2),
    new THREE.MeshStandardMaterial({color:new THREE.Color(...g.rgba.slice(0,3)), metalness:0.2, roughness:0.6}));
  if (g.type === 'cylinder') return new THREE.Mesh(
    new THREE.CylinderGeometry(g.size[0], g.size[0], g.size[1]*2, 24),
    new THREE.MeshStandardMaterial({color:new THREE.Color(...g.rgba.slice(0,3)), metalness:0.3, roughness:0.4}));
  if (g.type === 'plane') {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(6,6),
      new THREE.MeshStandardMaterial({color:0x1a2230}));
    return m;
  }
  return null;
}

async function loadScene() {
  meta = await (await fetch('/scene.json')).json();
  const groups = meta.bodies.map(() => new THREE.Group());
  groups.forEach(g => pivot.add(g));
  for (const g of meta.geoms) {
    const m = buildMesh(g);
    if (!m) continue;
    m.position.set(g.pos[0], g.pos[1], g.pos[2]);
    m.quaternion.set(g.quat[1], g.quat[2], g.quat[3], g.quat[0]);   // MuJoCo (w,x,y,z) -> three (x,y,z,w)
    groups[g.body].add(m);
  }
  bodyNodes = groups;
  renderer.setAnimationLoop(() => renderer.render(scene, camera));
}

async function pollPose() {
  try {
    const d = await (await fetch('/pose')).json();
    for (let b = 0; b < bodyNodes.length; b++) {
      const p = d.b[b]; if (!p) continue;
      bodyNodes[b].position.set(p[0], p[1], p[2]);
      bodyNodes[b].quaternion.set(p[4], p[5], p[6], p[3]);
    }
  } catch (e) {}
}

const pressed = new Set();
let selected = 0;
const KEYMAP = { w:1, s:1, a:1, d:1, q:1, e:1, g:1, h:1, z:1, x:1, c:1, v:1,
                 arrowup:1, arrowdown:1, m:1, r:1, '1':1,'2':1,'3':1,'4':1,'5':1,'6':1 };

function focusCanvas() {
  focusHint.classList.add('hidden');
  document.getElementById('kb').textContent = '已启用';
  document.getElementById('kb').style.color = '#4ade80';
  window.focus();
}

addEventListener('keydown', ev => {
  const k = ev.key.toLowerCase();
  if (!KEYMAP[k]) return;
  ev.preventDefault();
  if (k === 'm') { fetch('/magnet'); return; }
  if (k === 'r') { fetch('/reset'); return; }
  if (k >= '1' && k <= '6') { selected = +k - 1; syncKeys(); return; }
  pressed.add(k);
  syncKeys();
});
addEventListener('keyup', ev => {
  const k = ev.key.toLowerCase();
  if (!KEYMAP[k]) return;
  ev.preventDefault();
  pressed.delete(k);
  syncKeys();
});
addEventListener('blur', () => { pressed.clear(); syncKeys(); });

function syncKeys() {
  fetch('/keys', { method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({ keys:[...pressed], selected, slow: false }) }).catch(()=>{});
}

async function pollState() {
  try {
    const s = await (await fetch('/state')).json();
    const j = s.judgments;
    const setLamp = (id, v) => document.getElementById(id).classList.toggle('on', !!v);
    setLamp('lGrasp', j.grasped); setLamp('lIns', j.inserted);
    setLamp('lP', j.p_ok); setLamp('lQ', j.q_ok);
    document.getElementById('vGrasp').textContent = j.grasped ? '✅' : '—';
    document.getElementById('vIns').textContent = j.inserted ? '✅' : '—';
    document.getElementById('vP').textContent = j.p_ok ? '✅' : '—';
    document.getElementById('vQ').textContent = j.q_ok ? '✅' : '—';
    const all = j.grasped && j.inserted && j.p_ok && j.q_ok;
    document.getElementById('done').textContent = all ? '三级完成 🎉' : '进行中';

    document.getElementById('rDepth').textContent = s.depth_mm.toFixed(1) + ' mm';
    document.getElementById('rAxis').textContent = s.axis_deg.toFixed(1) + '°';
    document.getElementById('rGrip').textContent = s.grip_mm.toFixed(1) + ' mm';
    document.getElementById('rP').textContent = s.p_deg.toFixed(1) + '°';
    document.getElementById('rQ').textContent = s.q_deg.toFixed(1) + '°';
    document.getElementById('depth').textContent = s.depth_mm.toFixed(0) + ' mm';

    document.getElementById('cX').textContent = s.chassis.x.toFixed(3);
    document.getElementById('cY').textContent = s.chassis.y.toFixed(3);
    document.getElementById('cYaw').textContent = (s.chassis.yaw * 180 / Math.PI).toFixed(1) + '°';

    const jb = document.getElementById('joints');
    jb.innerHTML = s.joints.map((v, i) =>
      `<tr><td class="${i === s.selected ? '' : 'muted'}">J${i+1}${i === s.selected ? ' ◀' : ''}</td>
       <td>${(v * 180 / Math.PI).toFixed(1)}°</td></tr>`).join('');

    document.getElementById('serial').textContent = s.serial_ok ? '已连接' : (s.serial_msg || '未连接');
    document.getElementById('serial').style.color = s.serial_ok ? '#4ade80' : '#7b8798';
    document.getElementById('btnMagnet').classList.toggle('on', !!s.magnet);
  } catch (e) {}
}

document.getElementById('btnOpen').onclick = () => fetch('/gripper?open=1');
document.getElementById('btnClose').onclick = () => fetch('/gripper?open=0');
document.getElementById('btnMagnet').onclick = () => fetch('/magnet');
document.getElementById('btnReset').onclick = () => fetch('/reset');
focusHint.addEventListener('click', focusCanvas);

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
loadScene().then(() => {
  setInterval(pollPose, 1000 / 60);
  setInterval(pollState, 150);
});
</script>
</body>
</html>
